name: flare_mobile
description: Native Flutter client for the self-hosted Flare homelab control plane.
publish_to: none
version: 1.2.7+13

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.4.2
  go_router: 18.0.1
  dio: 5.11.0
  flutter_secure_storage: 10.0.0
  fl_chart: 1.2.0
  phosphor_icons: 3.0.1
  flutter_animate: 4.5.2
  shared_preferences: 2.5.5
  intl: 0.20.3
  package_info_plus: 10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
