name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300
          cache: true
          cache-dependency-path: '**/*.csproj'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Restore
        run: dotnet restore Flare.sln
      - name: Build backend
        run: dotnet build src/Flare.Api/Flare.Api.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/Flare.Api.Tests/Flare.Api.Tests.csproj --configuration Release --no-restore
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - name: Restore Flutter packages
        working-directory: src/Flare.Mobile
        run: flutter pub get
      - name: Analyze Flutter client
        working-directory: src/Flare.Mobile
        run: flutter analyze --fatal-infos
      - name: Test Flutter client
        working-directory: src/Flare.Mobile
        run: flutter test
      - name: Build Android app (Debug signing)
        working-directory: src/Flare.Mobile
        run: flutter build apk --debug

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose
        env:
          ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=flare;Username=flare;Password=ci-only;SSL Mode=Disable
          FLARE_JWT_SIGNING_KEY: ci-only-signing-key-at-least-32-bytes
          COOLIFY_BASE_URL: https://coolify.example.test
          COOLIFY_API_TOKEN: ci-only-token
          DOCKER_SOCKET_GID: "999"
        run: sed 's/exclude_from_hc:/x-coolify-exclude-from-hc:/' compose.yml | docker compose --project-directory . -f - config --quiet
      - name: Build production image
        run: docker build --tag flare-api:ci .
